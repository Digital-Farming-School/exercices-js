<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue de semences — Ferme-école</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- ===== EN-TÊTE ===== -->
  <header class="entete">
    <p class="surtitre">Ferme-école · Banque de semences</p>
    <h1>Catalogue de semences</h1>
  </header>

  <main>

    <!-- ===== FILTRES : un seul écouteur sur ce conteneur suffira (étape 6) ===== -->
    <div class="filtres" id="filtres" role="group" aria-label="Filtrer par saison de semis">
      <button type="button" data-saison="toutes" aria-pressed="true">Toutes</button>
      <button type="button" data-saison="printemps" aria-pressed="false">Printemps</button>
      <button type="button" data-saison="ete" aria-pressed="false">Été</button>
      <button type="button" data-saison="automne" aria-pressed="false">Automne</button>
      <button type="button" data-saison="hiver" aria-pressed="false">Hiver</button>
    </div>

    <p class="compteur" id="compteur" aria-live="polite">Le catalogue est vide.</p>

    <!-- ===== CATALOGUE : vide dans le HTML, rempli par le script ===== -->
    <ul class="catalogue" id="catalogue"></ul>

    <p class="message-vide cache" id="message-vide">Aucune semence ne correspond à cette saison.</p>

    <!-- ===== AJOUT D'UNE SEMENCE (étape 7) ===== -->
    <form class="ajout" id="formulaire-ajout" action="/ajouter" method="post">
      <h2>Ajouter une semence au catalogue</h2>

      <label for="nom-semence">Nom de la semence</label>
      <input type="text" id="nom-semence" name="nom" required maxlength="40">

      <label for="saison-semence">Saison de semis</label>
      <select id="saison-semence" name="saison">
        <option value="printemps">Printemps</option>
        <option value="ete">Été</option>
        <option value="automne">Automne</option>
        <option value="hiver">Hiver</option>
      </select>

      <label for="jours-semence">Jours avant la récolte</label>
      <input type="number" id="jours-semence" name="jours" min="1" max="365" value="60" required>

      <p><button type="submit" class="bouton">Ajouter au catalogue</button></p>
    </form>

  </main>

  <!-- ===== MODÈLE DE CARTE : <template> n'est jamais affiché, il sert de moule (étape 4) ===== -->
  <template id="modele-carte">
    <li class="carte">
      <img class="carte__image" src="" alt="" width="400" height="300">
      <div class="carte__corps">
        <h3 class="carte__nom"></h3>
        <p class="carte__saisons"></p>
        <p class="carte__jours"></p>
        <p class="carte__description"></p>
        <button type="button" class="bouton-retirer">Retirer</button>
      </div>
    </li>
  </template>

  <footer class="pied">
    <p>Exercice DFS — JavaScript, sprint 1</p>
  </footer>

</body>
</html>
